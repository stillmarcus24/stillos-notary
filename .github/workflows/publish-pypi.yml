name: Publish Python SDK to PyPI

# Publishes python/ to PyPI via Trusted Publishing (OIDC) on every v* tag.
# Zero stored secrets: PyPI verifies this exact repo+workflow identity at
# publish time via a short-lived OIDC token, nothing saved on either side.
# One-time setup required on pypi.org before the first tag: add a
# "pending publisher" for project "stillos" -> owner stillmarcus24,
# repo stillos-notary, workflow publish-pypi.yml, no environment.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
